name: Refresh profile activity

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run updater tests
        shell: bash
        run: |
          if ! python -m unittest discover -s tests -v > /tmp/profile-activity-tests.log 2>&1; then
            cat /tmp/profile-activity-tests.log
            exit 1
          fi

      - name: Refresh generated sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_activity.py

      - name: Commit changed activity
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Profile activity is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(profile): refresh releases and writing"
          git push
