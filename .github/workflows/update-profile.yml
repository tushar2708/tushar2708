name: Refresh profile activity

on:
  push:
    branches:
      - main
    paths:
      - "data/profile.json"
      - "scripts/update_activity.py"
      - "scripts/update_stats.py"
      - "scripts/render_topology.py"
      - "scripts/render_banner.py"
      - "assets/topology-light.svg"
      - "assets/topology-dark.svg"
      - "tests/**"
      - ".github/workflows/update-profile.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run updater tests
        shell: bash
        run: |
          if ! python -m unittest discover -s tests -v > /tmp/profile-activity-tests.log 2>&1; then
            cat /tmp/profile-activity-tests.log
            exit 1
          fi

      - name: Verify generated topology assets
        shell: bash
        run: |
          python scripts/render_topology.py --check
          python scripts/render_banner.py --check
          python scripts/update_stats.py --check

      - name: Refresh generated activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_activity.py

      - name: Refresh aggregate GitHub statistics
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python scripts/update_stats.py --refresh

      - name: Commit changed profile data
        shell: bash
        run: |
          if git diff --quiet -- README.md data/stats-cache.json assets/stats-light.svg assets/stats-dark.svg; then
            echo "Profile data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/stats-cache.json assets/stats-light.svg assets/stats-dark.svg
          git commit -m "chore(profile): refresh activity and statistics"
          git push
